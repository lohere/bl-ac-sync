[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acsync"
version = "0.0.1"
description = "Archicad to Blender geometry sync via Tapir and IFC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ifcopenshell>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
